# Dependabot keeps every pinned dependency current. Security updates (on as a
# repository setting) open a pull request as soon as a fixed version of a
# vulnerable package is out; these version updates catch the rest weekly.
# Patch and minor updates merge themselves once Tests pass
# (.github/workflows/dependabot-merge.yml); major ones wait for review.
# Version updates only propose releases that are a week old (cooldown), so a
# hijacked package release is usually caught and pulled before it could
# reach players; security updates don't wait.
version: 2
updates:
  - package-ecosystem: pip       # what the companion bundles, and builds with
    directory: /companion
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7   # new versions wait a week, so a hijacked release is usually pulled first
    groups:
      companion:
        update-types: [minor, patch]

  - package-ecosystem: pip       # the test tools
    directory: /tests
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7   # new versions wait a week, so a hijacked release is usually pulled first
    groups:
      test-tools:
        update-types: [minor, patch]

  - package-ecosystem: pip       # the vulnerability audit
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7   # new versions wait a week, so a hijacked release is usually pulled first
    groups:
      audit-tools:
        update-types: [minor, patch]

  - package-ecosystem: npm       # wrangler, which deploys the server
    directory: /server
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7   # new versions wait a week, so a hijacked release is usually pulled first
    groups:
      server:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7   # new versions wait a week, so a hijacked release is usually pulled first
    groups:
      actions:
        update-types: [minor, patch]
