# zizmor (workflow security lint, run by tools/check.py). The data merge, the
# guides' weekly farm notes and the daily data release push a branch or a tag
# with git, so their checkout keeps the workflow token in .git/config; none
# uploads artifacts.
rules:
  artipacked:
    ignore:
      - data-merge.yml
      - guide-notes.yml
      - data-release.yml
