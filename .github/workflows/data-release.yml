# Ships new community drop data to players once a week. If
# GoldScout/Data_Community.lua or the companion's pinned dependencies
# (companion/requirements*.txt, kept current by Dependabot) changed since the
# latest version tag, or that tag is three weeks old, and the Tests workflow
# passed on this exact commit,
# it tags the next patch version (v0.4.0 -> v0.4.1) and starts the Release
# workflow on that tag, which publishes to GitHub, CurseForge and Wago.
# Otherwise it does nothing. The three-week rule keeps the regional price
# estimates each release bundles fresh: the addon stops using them after 30
# days (Blizzard's API terms; tools/bundle_prices.py).
#
# A tag pushed with the workflow token doesn't start other workflows by
# itself, so this starts Release explicitly.
name: Data release

on:
  schedule:
    # The server's cron starts this on Tuesdays at 15:00 UTC (GitHub skips
    # scheduled runs on the hour). This later one is a backup; a second run
    # finds the data already tagged and does nothing.
    - cron: "41 15 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether to release
        id: decide
        run: |
          summary() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            summary "No version tag yet; tag the first release by hand."
            exit 0
          fi
          reason="community data changed since $last"
          if ! git diff --quiet "$last" HEAD -- GoldScout/Data_Community.lua; then
            :
          elif ! git diff --quiet "$last" HEAD -- companion/requirements.txt companion/requirements-build.txt; then
            reason="the companion's dependencies changed since $last (security and bug fixes)"
          else
            tagged=$(git for-each-ref --format='%(creatordate:unix)' "refs/tags/$last")
            if [ $(( $(date +%s) - tagged )) -lt $(( 21 * 86400 )) ]; then
              summary "No new community data or dependency updates since $last, so no release."
              exit 0
            fi
            reason="$last is three weeks old, so its price estimates need refreshing"
          fi
          head=$(git rev-parse HEAD)
          tests=$(gh run list --workflow tests.yml --branch main --limit 20 \
            --json headSha,status,conclusion \
            --jq "map(select(.headSha == \"$head\")) | .[0] | \"\(.status) \(.conclusion)\"")
          if [ "$tests" != "completed success" ]; then
            summary "Ready to release ($reason), but Tests haven't passed on ${head:0:7} (${tests:-no run}); not releasing."
            exit 0
          fi
          version=${last#v}
          IFS=. read -r major minor patch <<< "$version"
          next="v$major.$minor.$((patch + 1))"
          {
            echo "Releasing **$next**: $reason."
            echo
            echo "Other files changed since $last:"
            echo
            git diff --name-only "$last" HEAD -- . ':(exclude)GoldScout/Data_Community.lua' ':(exclude)data' \
              | sed 's/^/- /' | head -50
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and start the release
        if: steps.decide.outputs.tag != ''
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "GoldScout $TAG: community data and price update"
          git push origin "$TAG"
          gh workflow run release.yml --ref "$TAG"
          echo "Tagged $TAG and started the Release workflow." | tee -a "$GITHUB_STEP_SUMMARY"
