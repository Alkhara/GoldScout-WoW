# Runs tools/check.py (Lua syntax, Python lint, community data validation and
# every test, including the Lua tests) on every push to main and on pull
# requests. The same script runs locally from the pre-push hook.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    # Data-only pull requests (from the Merge community data workflow) are
    # validated there, and Tests runs on main after they merge.
    paths-ignore:
      - "data/**"
      - "GoldScout/Data_Community.lua"
  workflow_dispatch: # the data merge starts it after merging a data pull request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install check tools
        run: python -m pip install -r tests/requirements.txt

      - name: Run every check
        run: python tools/check.py
