# Checks every pinned dependency against the public vulnerability databases
# (PyPI's and OSV's for Python, npm's for the server's tools): daily, and on
# every push that changes a pin. A known vulnerability fails the run, which
# emails the maintainer; Dependabot's security updates open the fix. It's kept
# out of Tests on purpose, so a vulnerability with no fix yet never blocks
# releases.
name: Security audit

on:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]
    paths:
      - "**/requirements*.txt"
      - "server/package.json"
      - "server/package-lock.json"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Python packages (companion, its build, tests)
        run: |
          python -m pip install -r tools/requirements.txt
          pip-audit --strict --desc \
            -r companion/requirements.txt -r companion/requirements-build.txt \
            -r tests/requirements.txt -r tools/requirements.txt

      - name: Server packages
        if: always()
        working-directory: server
        run: npm audit --audit-level=high
