# Tests and deploys the upload service (server/) whenever it changes on main,
# so the live server always matches the repo, and a change to the export format
# reaches the server before any addon release (Release checks for that too).
#
#   1. Runs tests/test_server.py against a local copy (wrangler dev, local D1).
#   2. Applies server/schema.sql to the live D1 database (it only creates what
#      is missing, so re-running it is safe).
#   3. Deploys the Worker, then checks /health and that the live server accepts
#      this build's export format.
#
# Needs, for steps 2-3: repository secret CLOUDFLARE_API_TOKEN (a token with
# Workers Scripts: Edit and D1: Edit on the account) and repository variable
# CLOUDFLARE_ACCOUNT_ID. Without them the tests still run and deploying is
# skipped.
name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "tests/test_server.py"
      - "tools/verify_release.py"
      - ".github/workflows/server-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wrangler
        working-directory: server
        run: npm ci

      - name: Test against a local copy
        working-directory: server
        run: |
          printf 'ADMIN_TOKEN=local-admin-token\nIP_SALT=local-salt\nMIN_SECONDS_BETWEEN_UPLOADS=0\n' > .dev.vars
          printf 'GITHUB_DISPATCH_TOKEN=local-dispatch-token\nGITHUB_API=http://127.0.0.1:8798\n' >> .dev.vars
          npx wrangler d1 execute goldscout --local --file schema.sql
          npx wrangler dev --local --port 8799 --test-scheduled > ../wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8799/health && break
            sleep 2
          done
          cd ..
          GOLDSCOUT_TEST_SERVER=http://127.0.0.1:8799 GOLDSCOUT_TEST_GITHUB=8798 python -m unittest tests.test_server -v

      - name: Show the local server log
        if: failure()
        run: cat wrangler-dev.log || true

      - name: Apply the schema and deploy
        if: env.HAS_TOKEN == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute goldscout --remote --file schema.sql
          npx wrangler deploy

      - name: Check the live server
        if: env.HAS_TOKEN == 'true'
        run: |
          sleep 10
          curl -sf https://goldscout-api.cawley22.workers.dev/health
          echo
          python tools/verify_release.py server
          echo "Deployed and checked the live server." >> "$GITHUB_STEP_SUMMARY"

      - name: Note the skipped deploy
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "Tests passed. **Deploy skipped:** add the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable to deploy from here." | tee -a "$GITHUB_STEP_SUMMARY"
