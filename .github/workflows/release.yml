# Builds a release zip and uploads it to CurseForge, Wago and GitHub when you
# push a version tag (for example: git tag v0.1.0 && git push origin v0.1.0).
#
# Setup, once:
#   1. Create the CurseForge and Wago projects, then add their IDs to
#      GoldScout/GoldScout.toc as "## X-Curse-Project-ID: 123456" and
#      "## X-Wago-ID: abcd1234".
#   2. In GitHub: Settings > Secrets and variables > Actions, add CF_API_KEY
#      (CurseForge API token) and WAGO_API_TOKEN (Wago API token).
#   3. WoWInterface: after uploading the first version there by hand, add its
#      ID (the number in the addon's URL) to the TOC as "## X-WoWI-ID: 12345",
#      and add the secret WOWI_API_TOKEN (an API token from WoWInterface's author control panel).
# Uploads to a site are skipped until its ID and token are both set.
#
# It can also be started by hand or by the Data release workflow on a tag
# ("Run workflow" with a v* tag selected); on any other ref it does nothing.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check Lua syntax
        run: python3 tools/luacheck_lite.py GoldScout/*.lua

      # Players' uploads would be rejected if the live server didn't accept
      # the export format this build writes; stop before publishing anything.
      - name: Check the upload server accepts this build's exports
        run: python3 tools/verify_release.py server

      # Players' release notes: this version's section of CHANGELOG.md, or for a
      # weekly data release a generated note. The packager publishes the file on
      # GitHub, CurseForge and Wago (.pkgmeta manual-changelog).
      - name: Write the release notes
        run: python3 tools/changelog.py notes "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      # New players' Farm list works before they have prices of their own:
      # regional estimates from the server's copy of Blizzard's snapshots,
      # written over the empty stub in git (tools/bundle_prices.py).
      - name: Bundle regional price estimates
        run: python3 tools/bundle_prices.py

      - name: Package and upload
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

  # Builds GoldScoutCompanion.exe, signs it with Azure Artifact Signing when
  # that's configured, and attaches it to the same GitHub release.
  #
  # Signing turns on once these repository variables exist (Settings > Secrets
  # and variables > Actions > Variables): AZURE_CLIENT_ID, AZURE_TENANT_ID,
  # AZURE_SUBSCRIPTION_ID, SIGNING_ENDPOINT (for example
  # https://eus.codesigning.azure.net/), SIGNING_ACCOUNT and SIGNING_PROFILE.
  # Azure login uses GitHub's OIDC token, so no password is stored. The job runs
  # in the "release" environment so the Azure federated credential can trust
  # one fixed subject (repo:Alkhara/GoldScout-WoW:environment:release) for
  # every tag.
  companion:
    needs: release
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The companion reports the tag's version, even on a weekly data release
      # that changed no code (otherwise it would keep offering the same update).
      - name: Build the companion
        shell: bash
        run: |
          python tools/stamp_companion.py "$GITHUB_REF_NAME"
          python -m pip install -r companion/requirements-build.txt -r companion/requirements.txt
          python -m unittest discover -s tests
          python companion/build.py

      - name: Azure login
        if: vars.SIGNING_ACCOUNT != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the companion
        if: vars.SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\companion\dist\GoldScoutCompanion.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: GoldScout Companion
          description-url: https://github.com/Alkhara/GoldScout-WoW

      - name: Check the signature
        if: vars.SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature companion\dist\GoldScoutCompanion.exe
          "Signature: $($signature.Status), signed by $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { exit 1 }

      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" companion/dist/GoldScoutCompanion.exe --clobber

  # Builds GoldScout Companion.app for Apple silicon and Intel Macs. Only a
  # signed and notarized app is attached to the release; until Apple signing
  # is set up, the unsigned build is kept as this run's artifact for testing.
  #
  # Signing turns on once the repository variable APPLE_TEAM_ID exists (the
  # 10-character Team ID; it must match MAC_TEAM_ID in companion/updater.py)
  # and these secrets are set:
  #   APPLE_DEVELOPER_ID_P12           the "Developer ID Application" certificate
  #                                    with its private key, as base64 of the .p12
  #   APPLE_DEVELOPER_ID_P12_PASSWORD  that .p12's password
  #   APPLE_NOTARY_KEY                 an App Store Connect API key (.p8), as base64
  #   APPLE_NOTARY_KEY_ID              that key's ID
  #   APPLE_NOTARY_ISSUER_ID           the key's issuer ID
  companion-mac:
    needs: release
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    env:
      APP: companion/dist/GoldScout Companion.app
      ZIP: companion/dist/GoldScoutCompanion-macOS.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # python.org's installer is universal2 (Apple silicon and Intel), so the
      # app can be too; setup-python's builds are one architecture.
      - name: Install Python 3.12 (universal2)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          echo "PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12" >> "$GITHUB_ENV"

      - name: Build the companion
        run: |
          "$PY" tools/stamp_companion.py "$GITHUB_REF_NAME"
          "$PY" -m pip install -r companion/requirements-build.txt
          "$PY" -m unittest discover -s tests
          "$PY" companion/build.py --universal2
          archs="$(lipo -archs "$APP/Contents/MacOS/GoldScout Companion")"
          echo "Architectures: $archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]

      - name: Check the updater trusts this team
        if: vars.APPLE_TEAM_ID != ''
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: grep -q "^MAC_TEAM_ID = \"$TEAM\"$" companion/updater.py || { echo "Set MAC_TEAM_ID = \"$TEAM\" in companion/updater.py"; exit 1; }

      - name: Sign and notarize
        if: vars.APPLE_TEAM_ID != ''
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/developer-id.p12"

          codesign --force --deep --options runtime --timestamp --keychain "$keychain" \
            --sign "Developer ID Application" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q "^TeamIdentifier=$TEAM$"

          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait --timeout 30m
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$ZIP"
          security delete-keychain "$keychain"

      - name: Attach it to the release
        if: vars.APPLE_TEAM_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber

      - name: Keep the unsigned build for testing
        if: vars.APPLE_TEAM_ID == ''
        run: ditto -c -k --keepParent "$APP" "$ZIP"

      - name: Upload the unsigned build
        if: vars.APPLE_TEAM_ID == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GoldScoutCompanion-macOS-unsigned
          path: companion/dist/GoldScoutCompanion-macOS.zip
          retention-days: 14

  # Downloads what was just published and checks it: the zip's TOC version is
  # the tag, every file the TOC lists is in the zip, and the companion is there.
  verify:
    needs: [release, companion]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir published --pattern "*.zip" --pattern "*.exe"
          python3 tools/verify_release.py assets published "$GITHUB_REF_NAME"
