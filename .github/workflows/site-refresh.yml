# Rebuilds and redeploys the website once a day when nothing else has, so the
# gold guides' prices and trends ("rising", "What changed this week") are at
# most a day old. Cloudflare's Git integration (Workers Builds) builds the site
# on every push to main, which the hourly data merge usually provides; on a day
# without a push to main for 20 hours, this builds it the same way
# (python site/build.py) and deploys it with wrangler.
#
# The server's cron starts this daily at 15:00 UTC (server/src/index.js
# SCHEDULE; GitHub skips scheduled runs); the schedule below is a backup.
# Needs the CLOUDFLARE_API_TOKEN secret (Workers Scripts: Edit on the account,
# as for Deploy server) and the CLOUDFLARE_ACCOUNT_ID variable.
name: Site refresh

on:
  schedule:
    - cron: "47 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build and deploy even if main was pushed in the last 20 hours"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the site shows when the drop data last changed (git log)
          persist-credentials: false

      - name: Skip if main was pushed recently
        id: fresh
        env:
          FORCE: ${{ inputs.force }}
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$FORCE" != "true" ] && [ "$age" -lt 72000 ]; then
            echo "Main was pushed $(( age / 3600 )) hours ago; Workers Builds built the site then. Nothing to do." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Note the missing token
        if: steps.fresh.outputs.skip != 'true' && env.HAS_TOKEN != 'true'
        run: echo "**Skipped:** add the CLOUDFLARE_API_TOKEN secret to deploy the site from here." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.fresh.outputs.skip != 'true' && env.HAS_TOKEN == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.fresh.outputs.skip != 'true' && env.HAS_TOKEN == 'true'
        with:
          node-version: "22"

      - name: Build the site
        if: steps.fresh.outputs.skip != 'true' && env.HAS_TOKEN == 'true'
        run: python site/build.py

      - name: Install wrangler
        if: steps.fresh.outputs.skip != 'true' && env.HAS_TOKEN == 'true'
        working-directory: server
        run: npm ci

      - name: Deploy the site
        if: steps.fresh.outputs.skip != 'true' && env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          server/node_modules/.bin/wrangler deploy
          echo "Built and deployed the site." | tee -a "$GITHUB_STEP_SUMMARY"
