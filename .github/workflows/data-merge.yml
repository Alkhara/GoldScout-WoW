# Once a day (or when run by hand), gathers new drop data and opens or updates
# a pull request that adds it to data/submissions/ and regenerates
# GoldScout/Data_Community.lua:
#   - open issues labeled data-valid or data-approved (the Share drop data form)
#   - companion uploads from the upload service (server/), once
#     GOLDSCOUT_API_URL (variable) and GOLDSCOUT_API_ADMIN (secret) are set
# Everything is re-validated with tools/submission.py first. Merging the pull
# request closes the issues.
#
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests".
name: Merge community data

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: data-merge

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: data/community-update
    steps:
      - uses: actions/checkout@v4

      - name: Fetch accepted submissions
        run: |
          for label in data-valid data-approved; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&labels=$label&per_page=100" \
              --jq '.[] | select(.pull_request == null)
                    | {number, body, user: {id: .user.id, login: .user.login, type: .user.type},
                       labels: [.labels[].name]} | tostring'
          done > issues.jsonl

      - name: Fetch companion uploads
        env:
          API_URL: ${{ vars.GOLDSCOUT_API_URL }}
          API_ADMIN: ${{ secrets.GOLDSCOUT_API_ADMIN }}
        run: |
          if [ -n "$API_URL" ] && [ -n "$API_ADMIN" ]; then
            curl -fsS --max-time 60 -H "Authorization: Bearer $API_ADMIN" "${API_URL%/}/v1/uploads" -o uploads.json
          else
            echo "Upload service not configured; skipping."
            echo '{"uploads": []}' > uploads.json
          fi

      - name: Validate and store
        run: |
          python3 tools/data_bot.py collect issues.jsonl
          python3 tools/data_bot.py collect-uploads uploads.json

      - name: Regenerate community data
        run: |
          python3 tools/merge_data.py
          python3 tools/luacheck_lite.py GoldScout/Data_Community.lua

      - name: Open or update the pull request
        run: |
          if [ -z "$(git status --porcelain -- data GoldScout/Data_Community.lua)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data GoldScout/Data_Community.lua
          git commit -m "Update community drop data"
          git push --force origin "$BRANCH"
          state=$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)
          if [ "$state" = "OPEN" ]; then
            gh pr edit "$BRANCH" --body-file pr_body.md
          else
            gh pr create --base main --head "$BRANCH" --title "Update community drop data" --body-file pr_body.md
          fi
