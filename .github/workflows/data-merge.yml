# Every hour (started by the GoldScout server's cron trigger, with GitHub's own
# schedule as a backup; see server/README.md), or when run by hand, gathers
# new drop data and opens or updates a pull request that adds it to
# data/submissions/ and regenerates
# GoldScout/Data_Community.lua:
#   - open issues labeled data-valid or data-approved (the Share drop data form)
#   - companion uploads from the upload service (server/), once the
#     GOLDSCOUT_API_ADMIN secret is set (GOLDSCOUT_API_URL, a variable, can
#     point it at a different server)
# Everything is re-validated with tools/submission.py first. Merging the pull
# request closes the issues.
#
# The pull request merges itself when it's clean: nothing held back for unusual
# rates, nothing failed validation, and the website's Cloudflare build for the
# branch (SITE_CHECK) passed. Otherwise it stays open for a maintainer, and the
# run summary says why. After merging, it starts the Tests workflow on main
# (the Data release workflow needs a passing Tests run on main's head).
#
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests".
name: Merge community data

on:
  schedule:
    - cron: "17 * * * *" # hourly; a run with no new data changes nothing
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  actions: write   # starts Tests after merging; also lets tools/admin_stats.py read workflow runs

concurrency:
  group: data-merge

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: data/community-update
      SITE_CHECK: "Workers Builds: goldscout-wow"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch accepted submissions
        run: |
          for label in data-valid data-approved; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&labels=$label&per_page=100" \
              --jq '.[] | select(.pull_request == null)
                    | {number, body, user: {id: .user.id, login: .user.login, type: .user.type},
                       labels: [.labels[].name]} | tostring'
          done > issues.jsonl

      - name: Fetch companion uploads
        env:
          API_URL: ${{ vars.GOLDSCOUT_API_URL || 'https://goldscout-api.cawley22.workers.dev' }}
          API_ADMIN: ${{ secrets.GOLDSCOUT_API_ADMIN }}
        run: |
          if [ -n "$API_URL" ] && [ -n "$API_ADMIN" ]; then
            curl -fsS --max-time 60 -H "Authorization: Bearer $API_ADMIN" "${API_URL%/}/v1/uploads" -o uploads.json
            count=$(python3 -c "import json; print(len(json.load(open('uploads.json')).get('uploads', [])))")
            echo "Upload service: $count install(s) found." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url_state=missing; [ -n "$API_URL" ] && url_state=set
            admin_state=missing; [ -n "$API_ADMIN" ] && admin_state=set
            {
              echo "**Upload service not configured**; companion uploads skipped."
              echo
              echo "- Variable \`GOLDSCOUT_API_URL\` (Settings > Secrets and variables > Actions > **Variables** tab): $url_state"
              echo "- Secret \`GOLDSCOUT_API_ADMIN\` (same page, **Secrets** tab): $admin_state"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo '{"uploads": []}' > uploads.json
          fi

      - name: Validate and store
        id: store
        run: |
          python3 tools/data_bot.py collect issues.jsonl
          python3 tools/data_bot.py collect-uploads uploads.json

      - name: Regenerate community data
        run: |
          python3 tools/merge_data.py
          python3 tools/luacheck_lite.py GoldScout/Data_Community.lua

      - name: Open or update the pull request
        id: pr
        run: |
          { echo; cat pr_body.md; } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$(git status --porcelain -- data GoldScout/Data_Community.lua)" ]; then
            echo "Nothing changed, so no pull request." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data GoldScout/Data_Community.lua
          git commit -m "Update community drop data"
          state=$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)
          # Runs are hourly: when an open pull request already holds exactly this
          # data, leave its branch alone (a push would start another site build)
          # and just re-check it for merging.
          if [ "$state" = "OPEN" ] && git fetch --quiet origin "$BRANCH" \
             && [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse FETCH_HEAD^{tree})" ]; then
            echo "The open pull request already has this data." | tee -a "$GITHUB_STEP_SUMMARY"
            gh pr edit "$BRANCH" --body-file pr_body.md
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push --force origin "$BRANCH"
          if [ "$state" = "OPEN" ]; then
            gh pr edit "$BRANCH" --body-file pr_body.md
          else
            gh pr create --base main --head "$BRANCH" --title "Update community drop data" --body-file pr_body.md
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge it if it's clean
        if: steps.pr.outputs.sha != ''
        env:
          SHA: ${{ steps.pr.outputs.sha }}
          HELD: ${{ steps.store.outputs.held }}
          REJECTED: ${{ steps.store.outputs.rejected }}
        run: |
          summary() { printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "${HELD:-0}" != "0" ] || [ "${REJECTED:-0}" != "0" ]; then
            summary "**Not merged automatically:** $HELD upload(s) held for review and $REJECTED rejected. Review the pull request."
            exit 0
          fi
          # Wait up to 20 minutes for Cloudflare to build the site from this branch.
          result=""
          for attempt in $(seq 1 60); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
              --jq ".check_runs[] | select(.name == \"$SITE_CHECK\") | \"\(.status) \(.conclusion)\"" | head -n 1)
            case "$result" in
              "completed success") break ;;
              completed*) break ;;
            esac
            sleep 20
          done
          if [ "$result" != "completed success" ]; then
            summary "**Not merged automatically:** the website build ($SITE_CHECK) ended as '${result:-not reported}'. Review the pull request."
            exit 0
          fi
          gh pr merge "$BRANCH" --merge --delete-branch
          gh workflow run tests.yml --ref main
          summary "**Merged automatically:** every check passed, including the website build. Started Tests on main."

      - name: Update the admin dashboard
        if: always()
        continue-on-error: true
        env:
          GOLDSCOUT_API_URL: ${{ vars.GOLDSCOUT_API_URL || 'https://goldscout-api.cawley22.workers.dev' }}
          GOLDSCOUT_API_ADMIN: ${{ secrets.GOLDSCOUT_API_ADMIN }}
          GOLDSCOUT_MY_INSTALLS: ${{ vars.GOLDSCOUT_MY_INSTALLS }}
          GITHUB_TOKEN: ${{ github.token }}
          # Workers request counts for the dashboard (Account Analytics: Read).
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$GOLDSCOUT_API_ADMIN" ]; then
            echo "GOLDSCOUT_API_ADMIN isn't set; the admin dashboard wasn't updated." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 tools/admin_stats.py | tee -a "$GITHUB_STEP_SUMMARY"
