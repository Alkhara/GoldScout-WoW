# GoldScout upload service. Deploy steps are in server/README.md.
name = "goldscout-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Serve at https://goldscout-api.cawley22.workers.dev; no per-version preview URLs.
workers_dev = true
preview_urls = false

# The admin dashboard's page, script and styles are bundled as text (src/admin/).
[[rules]]
type = "Text"
globs = ["**/admin/*.html", "**/admin/*.css", "**/admin/*.client.js"]
fallthrough = false

[[d1_databases]]
binding = "DB"
database_name = "goldscout"
database_id = "ac21113c-605f-4d85-afa2-dbdebabdc6bd"

# Start the auction price, data merge and weekly data release workflows on GitHub (SCHEDULE in
# src/index.js maps each cron to its workflow). Times are UTC.
[triggers]
crons = ["7,22,37,52 * * * *", "17 * * * *", "0 15 * * 2"]

[observability]
enabled = true
