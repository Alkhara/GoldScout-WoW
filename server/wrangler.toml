# GoldScout upload service. Deploy steps are in server/README.md.
name = "goldscout-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Serve at https://goldscout-api.cawley22.workers.dev; no per-version preview URLs.
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "goldscout"
database_id = "ac21113c-605f-4d85-afa2-dbdebabdc6bd"

[observability]
enabled = true
